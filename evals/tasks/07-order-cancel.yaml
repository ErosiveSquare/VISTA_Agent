id: order-cancel
fixture: pystore
tags: [feature, multi-file, python]
prompt: 给 OrderService 增加 cancel(order_id) 方法：把订单占用的库存全部退回，把订单标记为 cancelled 并返回 True；订单不存在或已取消则返回 False。
